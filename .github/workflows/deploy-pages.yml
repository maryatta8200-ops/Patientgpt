name: Deploy to GitHub Pages

# Publishes the built PWA to Pages. Enable once in the repository:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Works for both flavours of Pages site:
#   • https://<owner>.github.io            (user/org site, base "/")
#   • https://<owner>.github.io/<repo>/    (project site, base "/<repo>/")

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Work out the base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO" = "${OWNER}.github.io" ]; then
            BASE="/"
          else
            BASE="/${REPO}/"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Deploying with base path: $BASE"

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}

      - name: Verify the build is base-relative
        run: |
          BASE="${{ steps.base.outputs.base }}"
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/404.html
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          grep -q '"start_url": "./"' dist/manifest.webmanifest
          if [ "$BASE" != "/" ]; then
            grep -q "${BASE}assets/" dist/index.html || { echo "assets are not under $BASE"; exit 1; }
            if grep -q '"/assets/' dist/index.html; then echo "found a root-absolute asset path"; exit 1; fi
          fi
          echo "Build looks correct for base $BASE"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
