<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <title>Pulse — private questions, answered</title>
    <meta
      name="description"
      content="Pulse is a local-first private messaging PWA. Your conversations live only on your device — the relay keeps nothing."
    />

    <!-- Brand / install -->
    <meta name="theme-color" content="#05070a" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pulse" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Pulse" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pulse — private questions, answered" />
    <meta
      property="og:description"
      content="Local-first. Burn-after-read relay. Nothing to steal."
    />
    <meta property="og:image" content="%BASE_URL%icons/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-mark"></div>
      </div>
    </div>
    <noscript>
      <div style="padding: 32px; color: #e6f2f5; font-family: system-ui, sans-serif">
        <h1>Pulse needs JavaScript</h1>
        <p>Pulse stores and reads your conversations entirely on this device, which requires JavaScript.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
